name: Construir el .exe de Windows

# Cuándo se construye el .exe:
#
#   · cada cambio en main  → actualiza la release «ultima», de modo que
#                            siempre hay un .exe al día sin hacer nada;
#   · una etiqueta v*      → publica una release numerada y estable;
#   · a mano               → pestaña Actions → Run workflow.
#
# Para saltarse la compilación en un cambio que no toca el programa (por
# ejemplo corregir el README), basta con poner [skip ci] en el mensaje del
# commit: GitHub lo entiende por sí solo.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      # Mientras el trabajo vive en una rama, se compila también desde ella:
      # así hay un .exe descargable antes de fusionar. Se puede quitar esta
      # línea cuando la rama se haya integrado en main.
      - 'claude/programa-normativa-2026-oz6h8y'
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  construir:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Pasar las pruebas
        # Un ejecutable que no pasa las pruebas no se publica.
        run: python -m pytest -q

      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path 'controlhorario\version.py' `
                -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      - name: Empaquetar el programa
        shell: pwsh
        env:
          CH_RAIZ: ${{ github.workspace }}
        run: |
          $env:CH_MODO = 'carpeta'
          python -m PyInstaller --noconfirm --clean construir\controlhorario.spec
          $env:CH_MODO = 'portable'
          python -m PyInstaller --noconfirm --clean construir\controlhorario.spec

      - name: Comprobar que el ejecutable arranca
        shell: pwsh
        # Arrancar la interfaz en el runner verifica que no falta ninguna
        # dependencia: si faltara, el proceso moriría en los primeros segundos.
        run: |
          $exe = 'dist\ControlHorario\ControlHorario.exe'
          if (-not (Test-Path $exe)) { throw "No se ha generado $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            $log = "$env:APPDATA\ControlHorario\error_arranque.log"
            if (Test-Path $log) { Get-Content $log }
            throw "El ejecutable se cerró solo (código $($p.ExitCode))."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'El ejecutable arranca correctamente.'

      - name: Crear el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host 'Instalando Inno Setup...'
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc -ErrorAction Stop).Source
          }
          & $iscc "/DMiVersion=${{ steps.version.outputs.version }}" `
                  'construir\instalador.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup ha fallado.' }

      - name: Nombrar los ejecutables
        shell: pwsh
        # Cada ejecutable se publica dos veces: con la versión en el nombre,
        # para dejar constancia de qué se entregó, y con un nombre fijo, que es
        # lo que permite dar a una empresa un enlace de descarga que no caduca
        # ni cambia al sacar una versión nueva.
        run: |
          $v = '${{ steps.version.outputs.version }}'
          Move-Item dist\ControlHorarioPortable.exe `
                    "dist\ControlHorario-Portable-$v.exe" -Force
          Copy-Item "dist\ControlHorario-Instalador-$v.exe" `
                    'dist\ControlHorario-Instalador.exe' -Force
          Copy-Item "dist\ControlHorario-Portable-$v.exe" `
                    'dist\ControlHorario-Portable.exe' -Force
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0,-48} {1,7:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Guardar los ejecutables
        uses: actions/upload-artifact@v5
        with:
          name: ControlHorario-Windows-${{ steps.version.outputs.version }}
          path: dist/*.exe
          retention-days: 90
          if-no-files-found: error

      - name: Publicar la versión estable
        # Sólo para etiquetas v*. La versión estable de la línea principal la
        # publica el trabajo 'fusionar', después de integrar la rama: una
        # compilación de main casi nunca llega a ocurrir, porque las fusiones
        # hechas con el token de Actions no disparan workflows.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $notas = @'
          ## Control Horario __VERSION__

          ### Descarga

          | Fichero | Para qué |
          |---|---|
          | **ControlHorario-Instalador-__VERSION__.exe** | Lo normal: instala el programa, crea el acceso directo y permite abrirlo al encender el equipo. |
          | ControlHorario-Portable-__VERSION__.exe | Sin instalar nada. Util para probarlo o llevarlo en un pendrive. |

          No hace falta tener Python instalado: va todo dentro.

          ### Al abrirlo, Windows avisara

          El ejecutable no esta firmado digitalmente, asi que SmartScreen mostrara
          *"Windows protegio su PC"*. Pulsa **Mas informacion -> Ejecutar de todas
          formas**. Es lo normal en programas sin certificado de firma.

          ### Tus datos

          Los registros de jornada se guardan en `%APPDATA%\ControlHorario`, aparte
          del programa. Instalar, actualizar o desinstalar no los toca: la ley
          obliga a conservarlos cuatro anos.
          '@
          $notas = $notas.Replace('__VERSION__', $v)
          $ficheros = (Get-ChildItem dist\*.exe).FullName

          # La release puede existir ya, si la etiqueta se creó desde la web de
          # GitHub en lugar de con 'git push'. En ese caso se le añaden los
          # ejecutables en vez de fallar por intentar crearla dos veces.
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              Write-Host "La release v$v ya existe: se refrescan los ficheros."
              gh release upload "v$v" @ficheros --clobber
            } else {
              Write-Host "La versión $v ya está publicada. Sube el número en"
              Write-Host "controlhorario/version.py para sacar una nueva."
              exit 0
            }
          } else {
            gh release create "v$v" @ficheros `
              --title "Control Horario $v" --notes $notas --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se han podido publicar los ejecutables.' }

      - name: Actualizar la descarga «última versión»
        # Cada cambio deja un .exe al día listo para descargar, sin tener que
        # etiquetar una versión ni acordarse de nada. Va marcada como
        # prelanzamiento para que no se confunda con una versión estable.
        if: "!startsWith(github.ref, 'refs/tags/v')"

        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $sha = '${{ github.sha }}'
          $corto = $sha.Substring(0, 7)
          $fecha = Get-Date -Format 'dd/MM/yyyy HH:mm'
          $ficheros = (Get-ChildItem dist\*.exe).FullName

          $notas = @'
          Compilación automática del último cambio en main.

          | | |
          |---|---|
          | Versión | __VERSION__ |
          | Commit | __SHA__ |
          | Compilado | __FECHA__ (UTC) |

          Descarga **ControlHorario-Instalador-__VERSION__.exe** y haz doble clic.
          No hace falta tener Python instalado.

          Esta descarga se reemplaza sola con cada cambio, asi que siempre
          apunta a lo ultimo. Para una version fija y estable, mira las releases
          numeradas.

          Windows mostrara *"Windows protegio su PC"* porque el ejecutable no
          esta firmado: **Mas informacion -> Ejecutar de todas formas**.
          '@
          $notas = $notas.Replace('__VERSION__', $v).Replace('__SHA__', $corto)
          $notas = $notas.Replace('__FECHA__', $fecha)

          gh release view ultima *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit ultima --title "Última versión ($v)" --notes $notas `
              --prerelease --target $sha
            gh release upload ultima @ficheros --clobber
          } else {
            gh release create ultima @ficheros --title "Última versión ($v)" `
              --notes $notas --prerelease --target $sha
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se ha podido actualizar la descarga.' }

          Write-Host "Descargable en: ${{ github.server_url }}/${{ github.repository }}/releases/tag/ultima"

  # ------------------------------------------------------------------------- #
  # Fusión automática
  # ------------------------------------------------------------------------- #
  fusionar:
    # Sólo si la compilación ha ido bien: unas pruebas en rojo frenan el cambio.
    needs: construir
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fusionar la rama, creando la PR si hace falta
        env:
          GH_TOKEN: ${{ github.token }}
          RAMA: ${{ github.ref_name }}
          BASE: main
        run: |
          set -euo pipefail

          # Sólo se tocan ramas de trabajo de este mismo repositorio: un push a
          # 'claude/*' exige permiso de escritura, así que no puede venir de
          # fuera. Las propuestas desde una bifurcación no disparan este trabajo.
          numero=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RAMA" \
                     --state open --json number --jq '.[0].number // empty')

          if [ -z "$numero" ]; then
            if git diff --quiet "origin/${BASE}...HEAD"; then
              echo "La rama no aporta cambios sobre ${BASE}. Nada que fusionar."
              exit 0
            fi
            echo "No hay ninguna PR abierta para $RAMA; se crea una."
            # Requiere «Allow GitHub Actions to create and approve pull
            # requests» en Settings → Actions → General. Si estuviera
            # desactivado, esto falla y el aviso de abajo lo explica.
            if ! gh pr create --repo "$GITHUB_REPOSITORY" \
                 --base "$BASE" --head "$RAMA" \
                 --title "$(git log -1 --pretty=%s)" \
                 --body "$(printf '%s\n\n%s' \
                    'Creada automáticamente tras una compilación correcta en Windows.' \
                    'Se fusiona sola: las pruebas y el arranque del ejecutable ya han pasado.')"
            then
              echo "::warning title=No se ha podido crear la PR::Actions no tiene" \
                   "permiso para abrir pull requests. Actívalo en Settings →" \
                   "Actions → General → Workflow permissions. El .exe se ha" \
                   "publicado igualmente."
              exit 0
            fi
            numero=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RAMA" \
                       --state open --json number --jq '.[0].number // empty')
          fi

          if [ -z "$numero" ]; then
            echo "::warning::No se ha podido determinar la PR de $RAMA."
            exit 0
          fi

          echo "Fusionando la PR #$numero ($RAMA)."
          # Fusión con commit de mezcla, no aplastada: así la rama sigue siendo
          # ancestro de main y las PR siguientes salen limpias en vez de
          # arrastrar cambios que ya estaban aplicados.
          gh pr merge "$numero" --repo "$GITHUB_REPOSITORY" --merge

      - name: Recuperar los ejecutables ya compilados
        uses: actions/download-artifact@v5
        with:
          name: ControlHorario-Windows-${{ needs.construir.outputs.version }}
          path: dist

      - name: Publicar la versión estable si estrena número
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.construir.outputs.version }}
        # Se hace aquí, ya con el código en main, y no en la compilación: basta
        # con subir el número en controlhorario/version.py para que salga una
        # release numerada. Es la que apunta .../releases/latest/download/...
        run: |
          set -euo pipefail

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $VERSION ya está publicada."
            echo "Sube el número en controlhorario/version.py para sacar otra."
            exit 0
          fi

          cat > notas.md <<NOTAS
          ## Control Horario $VERSION

          ### Descarga

          Enlace permanente, siempre la última versión estable:

          \`\`\`
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ControlHorario-Instalador.exe
          \`\`\`

          | Fichero | Para qué |
          |---|---|
          | **ControlHorario-Instalador.exe** | Instala el programa y crea el acceso directo |
          | ControlHorario-Portable.exe | Se ejecuta sin instalar nada |

          No hace falta tener Python: va todo dentro.

          ### Al abrirlo, Windows avisará

          El ejecutable no está firmado digitalmente, así que SmartScreen mostrará
          *"Windows protegió su PC"*. Pulsa **Más información → Ejecutar de todas
          formas**.

          ### Los datos

          Se guardan en \`%APPDATA%\ControlHorario\`, aparte del programa, y cada
          instalación es independiente. Instalar, actualizar o desinstalar no los
          toca: la ley obliga a conservarlos cuatro años.
          NOTAS

          gh release create "v$VERSION" dist/*.exe --repo "$GITHUB_REPOSITORY" \
            --title "Control Horario $VERSION" --notes-file notas.md --latest

          echo "Publicada la versión estable v$VERSION."
